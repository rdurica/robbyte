[global]
daemonize = no
error_log = /proc/self/fd/2

[www]
user = robbyte
group = nginx

listen = /run/php/php-fpm.sock
listen.owner = robbyte
listen.group = nginx
listen.mode = 0660

pm = dynamic
pm.max_children = 5
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3

clear_env = no
request_slowlog_timeout = 0
catch_workers_output = yes
decorate_workers_output = yes
